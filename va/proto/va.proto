syntax = "proto3";

package va;
option go_package = "github.com/letsencrypt/boulder/va/proto";

import "core/proto/core.proto";
import "google/protobuf/timestamp.proto";

service VA {
  rpc DoDCV(PerformValidationRequest) returns (ValidationResult) {}
}

service CAA {
  rpc DoCAA(IsCAAValidRequest) returns (IsCAAValidResponse) {}
}

message IsCAAValidRequest {
  // Next unused field number: 7
  reserved 1, 4; // Previously domain, authzID(string)
  // NOTE: For DNS identifiers, the value may be a wildcard domain name (e.g.
  // `*.example.com`).
  core.Identifier identifier = 5;
  string validationMethod = 2;
  int64 accountURIID = 3;
  int64 authzID = 6;
}

// If CAA is valid for the requested domain, the problem will be empty
message IsCAAValidResponse {
  core.ProblemDetails problem = 1;
  string perspective = 3;
  string rir = 4;
}

message PerformValidationRequest {
  // Next unused field number: 8
  reserved 1; // Previously dnsName
  core.Identifier identifier = 5;
  core.Challenge challenge = 2;
  AuthzMeta authz = 3;
  string expectedKeyAuthorization = 4;
  // AccountKeyThumbprints holds the current key's thumbprint first, then
  // those of prior keys from most to least recently replaced.
  repeated bytes accountKeyThumbprints = 6;
  // DNSPersistAccountURI is the accounturi of the dns-persist-01 record
  // validated by the primary perspective, which remote perspectives must also
  // observe.
  string DNSPersistAccountURI = 7;
}

message AuthzMeta {
  // Next unused field number: 4
  reserved 1; // Previously id(string)
  int64 regID = 2;
  int64 id = 3;
}

message ValidationResult {
  // Next unused field number: 6
  repeated core.ValidationRecord records = 1;
  core.ProblemDetails problem = 2;
  string perspective = 3;
  string rir = 4;
  google.protobuf.Timestamp persistUntil = 5;
}
