#
# Example YAML Boulder identifier policy
#
# This is *not* a production ready policy file and not reflective of Let's
# Encrypt's policies! It is just an example.

# BlockedExactNames prevent issuance for the exact names listed, as well as
# their wildcard form.
BlockedExactNames:
  "highrisk.le-test.hoffman-andrews.com": "2021-02-21"
  "exactblacklist.letsencrypt.org": "2021-02-21"

# BlockedPrefixes is a map of names as keys, with effective block dates as their
# value.
#
# To block an exact name, place it in BlockedExactNames
BlockedNames:
  # See RFC 3152
  "ip6.arpa": "2021-02-21"
  # See RFC 2317
  "in-addr.arpa": "2021-02-21"
  # Etc etc etc
  "example": "2021-02-21"
  "example.net": "2021-02-21"
  "example.org": "2021-02-21"
  "invalid": "2021-02-21"
  "local": "2021-02-21"
  "localhost": "2021-02-21"
  "test": "2021-02-21"
  "sealand": "2021-02-21"

# BlockedPrefixes is a map of IP address prefixes as keys, with effective block
# dates as their value. All IP addresses contained within the prefix are
# blocked.
#
# To block a single IP, append "/32" for IPv4 or "/128" for IPv6.
BlockedPrefixes:
  "64.112.117.66/32": "2021-02-21"
  "64.112.117.68/30": "2021-02-21"
  "224.0.0.0/4": "2021-02-21"
  "2602:80a:6000:baa:ffff:ffff:ffff:ffff/128": "2021-02-21"
  "2602:80a:6000:bad::/64": "2021-02-21"
  "ff00::/8": "2021-02-21"
