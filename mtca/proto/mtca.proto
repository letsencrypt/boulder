syntax = "proto3";

package mtca;
option go_package = "github.com/letsencrypt/boulder/mtca/proto";

import "core/proto/core.proto";

// MTCA issues MTC certificates.
service MTCA {
  // Issue requests that the CA start the process of creating a standalone certificate
  // for the given request. It returns once a checkpoint has been signed that includes
  // that certificate's TBSCertificateLogEntry, but does not wait for cosignatures.
  rpc Issue(IssueRequest) returns (IssueResponse) {}

  // StandaloneReady returns whether a given TBSCertificateLogEntry has sufficient signatures
  // for a standalone certificate to be built.
  // TODO(#8918): Make this part of MTCB instead.
  rpc StandaloneReady(StandaloneReadyRequest) returns (StandaloneReadyResponse) {}
}

message IssueRequest {
  // Next unused field number: 4
  bytes pubkey = 1;
  repeated core.Identifier identifiers = 2;
  string profile = 3;
}

message IssueResponse {
  // Next unused field number: 4
  string mtcLogID = 1;
  uint64 mtcSerialNumber = 2;
  int64 mtcSubtreeID = 3;
}

message StandaloneReadyRequest {
  // Next unused field number: 4
  string mtcLogID = 1;
  uint64 mtcSerialNumber = 2;
  int64 mtcSubtreeID = 3;
}

message StandaloneReadyResponse {
  // Next unused field number: 2
  bool ready = 1;
}
